name: Build Windows
# (and the Mac: both builds go into one release)

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'docs/**', '**.md' ]
  pull_request:
  workflow_dispatch:
    inputs:
      parts_branch:
        description: "Branch of the app repos to build from"
        default: "melville"

jobs:
  # The HAWTHORNE controller's firmware (Hardware/HAWTHORNE), signed so the box takes it, for MELVILLE
  # to carry and put on paired boxes from its DEVICES list.
  firmware:
    runs-on: ubuntu-latest
    env:
      ESP32_CORE: "3.3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino-esp32-${{ env.ESP32_CORE }}-1

      - name: The ESP32 core and the libraries (pinned)
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@$ESP32_CORE"
          for lib in adafruit/Adafruit-MCP23017-Arduino-Library#9e67e3732d1af68d8894b2f98c57bd9efa54027c \
                     adafruit/Adafruit_BusIO#3b8364267c3ee6e16bad91bc2101aefbd5b5915f \
                     avishorp/TM1637#3cca19607013c49f6708b7f492765fea835431ca \
                     johnrickman/LiquidCrystal_I2C#738765e388816fb2a687d40436cd2604febce1b1; do
            arduino-cli lib install --git-url "https://github.com/${lib%%#*}.git#${lib##*#}"
          done

      - name: Build
        run: |
          arduino-cli compile --fqbn esp32:esp32:wt32-eth01 --output-dir fwbuild Hardware/HAWTHORNE 2>&1 | tee fw.log
          test "${PIPESTATUS[0]}" -eq 0 || { echo "::error title=firmware::$(grep -m 30 -i error fw.log | tr '\n' ' ')"; exit 1; }

      - name: Sign
        env:
          SIGNING_KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
        run: |
          version=$(sed -n 's/.*FIRMWARE_VERSION "\(.*\)".*/\1/p' Hardware/HAWTHORNE/firmware_version.h)
          mkdir -p firmware
          if [ -z "$SIGNING_KEY" ]; then
            echo "::warning title=firmware::Not signed (no FIRMWARE_SIGNING_KEY secret), so MELVILLE won't carry it"
            exit 0
          fi
          pip install --quiet cryptography
          tool=$(ls ~/.arduino15/packages/esp32/hardware/esp32/*/tools/bin_signing.py | head -1)
          umask 077; printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          python3 "$tool" --bin fwbuild/HAWTHORNE.ino.bin --key "$RUNNER_TEMP/key.pem" --out "firmware/HAWTHORNE-$version.bin"
          rm -f "$RUNNER_TEMP/key.pem"
          # (the box checks against signing_key.h: make sure this one passes before it ships)
          python3 "$tool" --verify "firmware/HAWTHORNE-$version.bin" --pubkey Hardware/HAWTHORNE/signing_key.pem | tee verify.log
          grep -q "SUCCESSFUL" verify.log || { echo "::error title=firmware::The signature doesn't match signing_key.h"; exit 1; }
          echo "HAWTHORNE firmware $version, signed"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/
          if-no-files-found: ignore

  build:
    needs: firmware
    runs-on: windows-latest
    env:
      MELVILLE_VERSION: 1.0.${{ github.run_number }}
      # The apps' MELVILLE hooks live on this branch of each app repo until it's merged into main
      PARTS_BRANCH: ${{ github.event.inputs.parts_branch || 'melville' }}

    steps:
      - uses: actions/checkout@v4

      # every part, from its own repo
      - name: Get Hawthorne
        uses: actions/checkout@v4
        with: { repository: ShallowMouse/hawthorne, ref: "${{ env.PARTS_BRANCH }}", path: parts/hawthorne }
      - name: Get EMERSON
        uses: actions/checkout@v4
        with: { repository: ShallowMouse/emerson, ref: "${{ env.PARTS_BRANCH }}", path: parts/emerson }
      - name: Get WHITMAN
        uses: actions/checkout@v4
        with: { repository: ShallowMouse/whitman, ref: "${{ env.PARTS_BRANCH }}", path: parts/whitman }
      - name: Get THOREAU
        uses: actions/checkout@v4
        with: { repository: ShallowMouse/thoreau, ref: "${{ env.PARTS_BRANCH }}", path: parts/thoreau }
      - name: Get PEQUOD Host
        uses: actions/checkout@v4
        with: { repository: ShallowMouse/PEQUOD-HOST, ref: "${{ env.PARTS_BRANCH }}", path: parts/pequod-host }

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: parts/pequod-host/engine

      - name: Build the PEQUOD engine
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          rustup default stable
          cargo rustc --release -p pequod_engine --lib --target x86_64-pc-windows-msvc --manifest-path parts/pequod-host/engine/Cargo.toml -- --print native-static-libs *>&1 | Tee-Object -FilePath engine.log
          if ($LASTEXITCODE -ne 0) {
            $msg = (Select-String -Path engine.log -Pattern "error" | Select-Object -First 60 | ForEach-Object { $_.Line }) -join "%0A"; Write-Output "::error title=engine::$msg"
            exit 1
          }
          $lib = "parts/pequod-host/engine/target/x86_64-pc-windows-msvc/release/pequod_engine.lib"
          $libs = Select-String -Path engine.log -Pattern "native-static-libs: (.*)" | Select-Object -Last 1
          if ($libs) { Set-Content -Path "$lib.libs" -Value $libs.Matches[0].Groups[1].Value }
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE ".cargo" }
          $reg = Join-Path $cargoHome "registry\src"
          Get-ChildItem $reg -Recurse -Filter "*.lib" | Where-Object { $_.FullName -match "windows_x86_64_msvc-[^\\]+\\lib\\" } | ForEach-Object { Copy-Item $_.FullName (Split-Path $lib) -Force }

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 "-DMELVILLE_VERSION=$env:MELVILLE_VERSION" -DMELVILLE_BUILD_TESTS=ON *>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) {
            $msg = (Get-Content configure.log -Tail 60) -join "%0A"; Write-Output "::error title=configure::$msg"
            exit 1
          }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel -- /v:minimal *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $msg = (Select-String -Path build.log -Pattern "error" | Select-Object -First 60 | ForEach-Object { $_.Line }) -join "%0A"; Write-Output "::error title=build::$msg"
            exit 1
          }

      - name: Core tests (must pass to ship)
        shell: pwsh
        run: |
          & "build/MelvilleTests_artefacts/Release/MelvilleTests.exe" *>&1 | Tee-Object -FilePath tests.log
          $code = $LASTEXITCODE
          Select-String -Path tests.log -Pattern "FAIL" | ForEach-Object { Write-Output "::error title=test::$($_.Line)" }
          exit $code

      - name: MELVILLE ASIO driver test (must pass to ship)
        shell: pwsh
        run: |
          Push-Location build/asio/Release
          & ./MelvilleAsioTest.exe *>&1 | Tee-Object -FilePath ../../../asio-test.log
          $code = $LASTEXITCODE
          Pop-Location
          Select-String -Path asio-test.log -Pattern "FAIL" | ForEach-Object { Write-Output "::error title=asio::$($_.Line)" }
          exit $code

      - name: Smoke test (every part starts inside MELVILLE)
        shell: pwsh
        run: |
          $env:MELVILLE_QUIT_AFTER_MS = "8000"
          $p = Start-Process -FilePath "build/Melville_artefacts/Release/MELVILLE.exe" -PassThru -RedirectStandardOutput smoke.log -NoNewWindow
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Output "::error title=smoke::MELVILLE didn't quit"; exit 1 }
          Get-Content smoke.log
          if ($p.ExitCode -ne 0) { Write-Output "::error title=smoke::Not every part started (exit $($p.ExitCode))"; exit 1 }

      - name: Get the firmware
        uses: actions/download-artifact@v4
        continue-on-error: true            # (not signed: MELVILLE ships without it)
        with: { name: firmware, path: firmware }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, portable, firmware | Out-Null
          Copy-Item "build/Melville_artefacts/Release/MELVILLE.exe" portable/
          Copy-Item "build/asio/Release/MelvilleAsio.dll" portable/
          if (Get-ChildItem firmware -Filter *.bin) { New-Item -ItemType Directory -Force portable/firmware | Out-Null; Copy-Item firmware/*.bin portable/firmware/ }
          Copy-Item README.md portable/
          Copy-Item Resources/Licences/*.txt portable/
          Copy-Item Source/AsioDriver/LICENSE.txt portable/MELVILLE-ASIO-GPLv3.txt
          Compress-Archive -Path portable/* -DestinationPath "dist/MELVILLE-$env:MELVILLE_VERSION-portable.zip"
          # MELVILLE Link, for the other PCs (on its own: it doesn't need MELVILLE installed)
          New-Item -ItemType Directory -Force link | Out-Null
          Copy-Item "build/MelvilleLink_artefacts/Release/MELVILLE Link.exe" link/
          Copy-Item Resources/Licences/*.txt link/
          Compress-Archive -Path link/* -DestinationPath "dist/MELVILLE-Link-$env:MELVILLE_VERSION.zip"

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$env:MELVILLE_VERSION" Installer\MELVILLE.iss *>&1 | Tee-Object -FilePath iscc.log
          if ($LASTEXITCODE -ne 0) {
            $msg = (Get-Content iscc.log -Tail 40) -join "%0A"; Write-Output "::error title=installer::$msg"
            exit 1
          }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: MELVILLE-Windows
          path: dist/

  # MELVILLE for the Mac: one app for Apple silicon and Intel, from the same sources
  mac:
    needs: firmware
    runs-on: macos-15
    env:
      MELVILLE_VERSION: 1.0.${{ github.run_number }}
      PARTS_BRANCH: ${{ github.event.inputs.parts_branch || 'melville' }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - uses: actions/checkout@v4
      - name: Get Hawthorne
        uses: actions/checkout@v4
        with: { repository: ShallowMouse/hawthorne, ref: "${{ env.PARTS_BRANCH }}", path: parts/hawthorne }
      - name: Get EMERSON
        uses: actions/checkout@v4
        with: { repository: ShallowMouse/emerson, ref: "${{ env.PARTS_BRANCH }}", path: parts/emerson }
      - name: Get WHITMAN
        uses: actions/checkout@v4
        with: { repository: ShallowMouse/whitman, ref: "${{ env.PARTS_BRANCH }}", path: parts/whitman }
      - name: Get THOREAU
        uses: actions/checkout@v4
        with: { repository: ShallowMouse/thoreau, ref: "${{ env.PARTS_BRANCH }}", path: parts/thoreau }
      - name: Get PEQUOD Host
        uses: actions/checkout@v4
        with: { repository: ShallowMouse/PEQUOD-HOST, ref: "${{ env.PARTS_BRANCH }}", path: parts/pequod-host }

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: parts/pequod-host/engine

      - name: Build the PEQUOD engine (Apple silicon and Intel, joined)
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          M=parts/pequod-host/engine/Cargo.toml
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo rustc --release -p pequod_engine --lib --target $t --manifest-path $M -- --print native-static-libs 2>&1 | tee engine-$t.log
            test "${PIPESTATUS[0]}" -eq 0 || { echo "::error title=engine::$(grep -m 40 -i error engine-$t.log | tr '\n' ' ')"; exit 1; }
          done
          out=parts/pequod-host/engine/target/universal
          mkdir -p $out
          lipo -create parts/pequod-host/engine/target/aarch64-apple-darwin/release/libpequod_engine.a \
                       parts/pequod-host/engine/target/x86_64-apple-darwin/release/libpequod_engine.a -output $out/libpequod_engine.a
          sed -n 's/.*native-static-libs: //p' engine-aarch64-apple-darwin.log | tail -1 > $out/libpequod_engine.a.libs
          cat $out/libpequod_engine.a.libs

      - name: Configure
        run: |
          cmake -S . -B build -G Xcode "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            "-DMELVILLE_VERSION=$MELVILLE_VERSION" -DMELVILLE_BUILD_TESTS=ON \
            "-DPEQUOD_ENGINE_LIB=$PWD/parts/pequod-host/engine/target/universal/libpequod_engine.a" 2>&1 | tee configure.log
          test "${PIPESTATUS[0]}" -eq 0 || { echo "::error title=configure::$(tail -40 configure.log | tr '\n' ' ')"; exit 1; }

      - name: Build
        run: |
          cmake --build build --config Release --parallel -- -quiet 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" -eq 0 || { echo "::error title=build::$(grep -m 60 'error:' build.log | tr '\n' ' ')"; exit 1; }

      - name: Core tests (must pass to ship)
        run: |
          ./build/MelvilleTests_artefacts/Release/MelvilleTests 2>&1 | tee tests.log
          code=${PIPESTATUS[0]}
          grep FAIL tests.log | while read -r l; do echo "::error title=test::$l"; done
          exit $code

      - name: Smoke test (every part starts inside MELVILLE)
        run: |
          MELVILLE_QUIT_AFTER_MS=8000 timeout 90 ./build/Melville_artefacts/Release/MELVILLE.app/Contents/MacOS/MELVILLE 2>&1 | tee smoke.log
          code=${PIPESTATUS[0]}
          test $code -eq 0 || { echo "::error title=smoke::Not every part started on the Mac (exit $code)"; exit 1; }

      - name: Get the firmware
        uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: firmware, path: firmware }

      - name: Package (disk images, signed ad hoc)
        run: |
          mkdir -p dist dmg link
          app=build/Melville_artefacts/Release/MELVILLE.app
          if ls firmware/*.bin >/dev/null 2>&1; then mkdir -p "$app/Contents/Resources/firmware"; cp firmware/*.bin "$app/Contents/Resources/firmware/"; fi
          codesign --force --deep --sign - "$app"
          cp -R "$app" dmg/
          ln -s /Applications dmg/Applications
          cp README.md dmg/; cp Resources/Licences/*.txt dmg/
          hdiutil create -volname "MELVILLE $MELVILLE_VERSION" -srcfolder dmg -ov -format UDZO "dist/MELVILLE-$MELVILLE_VERSION-mac.dmg"
          lapp="build/MelvilleLink_artefacts/Release/MELVILLE Link.app"
          codesign --force --deep --sign - "$lapp"
          cp -R "$lapp" link/; ln -s /Applications link/Applications; cp Resources/Licences/*.txt link/
          hdiutil create -volname "MELVILLE Link $MELVILLE_VERSION" -srcfolder link -ov -format UDZO "dist/MELVILLE-Link-$MELVILLE_VERSION-mac.dmg"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: MELVILLE-Mac
          path: dist/

  # One release with both: Windows has to pass; the Mac's files go in when its build passed
  release:
    needs: [build, mac]
    if: always() && needs.build.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.parts_branch == '' || inputs.parts_branch == 'melville')))
    runs-on: ubuntu-latest
    env:
      MELVILLE_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: MELVILLE-Windows, path: dist }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: MELVILLE-Mac, path: dist }
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          MAC_RESULT: ${{ needs.mac.result }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::warning title=release::Not published - add the RELEASES_TOKEN secret"; exit 0; fi
          git log -1 --pretty=%s > notes.md
          [ "$MAC_RESULT" = "success" ] || echo "::warning title=release::The Mac build didn't pass: this release is Windows only"
          gh release create "v$MELVILLE_VERSION" --repo ShallowMouse/Melville-Releases \
            --title "MELVILLE $MELVILLE_VERSION" --notes-file notes.md dist/*
